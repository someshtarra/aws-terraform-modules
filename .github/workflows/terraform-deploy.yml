name: "Terraform Plan & Deploy (AWS OIDC)"

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'examples/full-stack/**'
      - 'modules/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action to execute'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write # Required for requesting the JWT OIDC token
  contents: read  # Required for actions/checkout
  pull-requests: write # For commenting PR plans

jobs:
  terraform-pipeline:
    name: "Terraform Plan & Deploy"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/full-stack

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::123456789012:role/github-actions-terraform-role' }}
          role-session-name: GitHubActionsTerraformSession
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan

      - name: Post Plan to Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan Status: \`Success\`
            *Pushed by: @${{ github.actor }}*
            *Working Directory: \`examples/full-stack\`*

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            Plan generated successfully. Review changes carefully before merging.
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan
